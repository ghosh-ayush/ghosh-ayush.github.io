name: Build and publish site

# GitHub Pages for this repo is set to "Deploy from a branch" (master, root), so
# the built site must be committed at the repo root. This workflow rebuilds it on
# every source push and commits the result, so you never have to remember to run
# `npm run deploy` by hand.
#
# Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
#
# If Pages is ever switched to Source = "GitHub Actions", replace the commit step
# with actions/upload-pages-artifact + actions/deploy-pages and stop committing
# build output. That is the cleaner setup; see README.

on:
  push:
    branches: [master]
    paths:
      # Only rebuild when source changes, not when this workflow commits output.
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'portfolio-data.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run deploy

      - name: Commit built site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A index.html assets documents favicon.svg 404.html robots.txt sitemap.xml .nojekyll

          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to commit."
          else
            git commit -m "chore: rebuild site [skip ci]"
            git push
          fi
