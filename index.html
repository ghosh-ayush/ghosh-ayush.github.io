    <!-- Apply the saved theme before first paint so dark-mode users never see a
         white flash. React deliberately hydrates in light mode to match the
         prerendered HTML, then syncs to this class in an effect. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('darkMode');
          var dark = saved !== null
            ? saved === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark-mode-preload');
        } catch (e) {}
      })();
    </script>
